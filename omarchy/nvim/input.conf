# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  kb_layout = fr
  kb_variant = mac
  kb_options = caps:shiftlock#, caps:escape, altwin:swap_lalt_lwin, lv3:ralt_switch

  # Change speed of keyboard repeat
  repeat_rate = 60
  repeat_delay = 170

  # Start with numlock on by default
  numlock_by_default = true

  # Increase sensitity for mouse/trackpack (default: 0)
  # sensitivity = 0.35

  touchpad {
    # Use natural (inverse) scrolling
    # natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4
  }
}

# Scroll nicely in the terminal
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
# gesture = 3, horizontal, workspace

device {
  #clavier bluetooth de merde
  name = kb-mini-mac-r
  kb_layout = fr
  kb_variant = mac
  kb_options = caps:escape
}

device {
  # gros clavier vieux
  name = logotech-gaming-keyboard
  kb_layout = fr
  kb_variant = mac
  kb_options = caps:escape, altwin:swap_lalt_lwin, lv3:ralt_switch
}

device {
  # gros clavier vieux
  name = logotech-gaming-keyboard-1
  kb_layout = fr
  kb_variant = mac
  kb_options = caps:escape, altwin:swap_lalt_lwin, lv3:ralt_switch
}

device {
  # clavier madlions effet hall (ce block ne sert à rien avec keyd, c'est un fallback)
  #   Géré dans keyd:
  #   -swap lalt lwin
  #   -caps:escape (en dur, impossible d'intercepter l'appui réel avec keyd actif)
  #   -couche ralt classique, ralt+z pr la touche "<", ralt+capslock pr capslock
  name = shenzhen-yizhita-technology-co.--ltd-mad68-keyboard
  kb_layout = fr
  kb_variant = mac
}

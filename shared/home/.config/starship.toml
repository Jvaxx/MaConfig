add_newline = true
command_timeout = 200
format = "$conda$python[$directory$git_branch$git_status]($style)$character"

[conda]
format = '[$symbol\($environment\)]($style) '
symbol = "🐍 "
style = "bold yellow"
ignore_base = false

# Local venvs (python -m venv / virtualenv) set VIRTUAL_ENV; conda uses $conda above.
[python]
format = '[$symbol\($virtualenv\)]($style) '
symbol = " "
style = "bold green"
# Only show when a venv is active — not for every Python project directory
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

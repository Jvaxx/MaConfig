# foot — Fedora Asahi Remix / KDE Plasma (Wayland).
#
# Host-specific on purpose: the quattro copy starts with
#   include=~/.local/state/omarchy/current/theme/foot.ini
# which does not exist here, and foot refuses to start on a missing include.
# The gruvbox-material palette that symlink resolved to is inlined below.
#
# foot is the terminal of choice on this machine: it renders on the CPU, so it
# works fine while the M3 GPU driver is still unfinished. kitty, alacritty and
# ghostty use GPU-oriented renderers; they are not installed by this profile.

[main]
# Native terminfo lets tmux identify foot and its extended keyboard support.
# On remote hosts without this terminfo, use TERM=xterm-256color ssh <host>.
term=foot
font=JetBrainsMono Nerd Font:size=12,JetBrains Mono:size=12,monospace:size=12
pad=14x14
initial-window-mode=windowed
# Keep foot's default renderer thread count; profile before tuning workers.

[scrollback]
multiplier=7.0
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
# MacBook keyboards have no dedicated Insert key; retain conventional chords.
clipboard-copy=Control+Shift+c Control+Insert
primary-paste=none
clipboard-paste=Control+Shift+v Shift+Insert

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

# --- Theme: gruvbox material (inlined from the Omarchy theme symlink) ---
[colors-dark]
cursor=282828 d4be98
foreground=d4be98

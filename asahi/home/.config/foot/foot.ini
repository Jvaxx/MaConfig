# foot — Fedora Asahi Remix / KDE Plasma (Wayland).
#
# Host-specific on purpose: the quattro copy starts with
#   include=~/.local/state/omarchy/current/theme/foot.ini
# which does not exist here, and foot refuses to start on a missing include.
# The gruvbox-material palette that symlink resolved to is inlined below.
#
# foot is the terminal of choice on this machine: it renders on the CPU, so it
# works fine while the M3 GPU driver is still unfinished. kitty, alacritty and
# ghostty all require working OpenGL and are not installed here.

[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12
pad=14x14
initial-window-mode=windowed
# 0 = render in the main thread. Cheap here and avoids thread churn on a
# machine doing all its compositing on the CPU already.
workers=0

[scrollback]
multiplier=7.0
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert
primary-paste=none
clipboard-paste=Shift+Insert

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

# --- Theme: gruvbox material (inlined from the Omarchy theme symlink) ---
[colors]
foreground=d4be98
background=282828
selection-foreground=d4be98
selection-background=504945

regular0=282828
regular1=ea6962
regular2=a9b665
regular3=d8a657
regular4=7daea3
regular5=d3869b
regular6=89b482
regular7=d4be98

bright0=665c54
bright1=ea6962
bright2=a9b665
bright3=d8a657
bright4=7daea3
bright5=d3869b
bright6=89b482
bright7=d4be98

[cursor]
color=282828 d4be98

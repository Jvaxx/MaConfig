# M3 without GPU acceleration: use shared-memory CPU video output on Wayland.
# X11 is only a fallback through XWayland. No hardware decoding is assumed.
# Check `mpv --vo=help` after installation; wlshm is the preferred output.
vo=wlshm,x11
hwdec=no

# Revisit these choices when a working GPU/video driver becomes available.
# Software output has fewer scaling, HDR and shader features than vo=gpu-next.
